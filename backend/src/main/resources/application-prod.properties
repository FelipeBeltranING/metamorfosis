# Perfil de producción (Render). Todos los valores salen de variables de entorno:
# nunca escribas aquí contraseñas ni secretos.

# Supabase: usar el "Session pooler" (puerto 5432), que funciona por IPv4.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# El pooler gratis de Supabase admite pocas conexiones: un pool pequeño basta.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiracion-minutos=${APP_JWT_EXPIRACION_MINUTOS:60}
