spring.application.name=backend
# Render asigna el puerto en la variable PORT; en local se usa 8080.
server.port=${PORT:8080}
spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Nunca exponer detalles internos en errores
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

# Orígenes permitidos (separados por coma). En producción: la URL de Vercel.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# HU21: URL pública del frontend, para armar los enlaces de logros compartidos (<url>/logros/<token>)
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

# HU8: correo de autorización del registro.
#   consola = no envía, escribe el correo y el enlace en el log (desarrollo)
#   brevo   = API de Brevo (necesita BREVO_API_KEY y un remitente verificado en Brevo)
app.correo.proveedor=${APP_CORREO_PROVEEDOR:consola}
app.correo.brevo.api-key=${BREVO_API_KEY:}
app.correo.remitente=${APP_CORREO_REMITENTE:no-responder@metamorfosis.app}
app.correo.remitente-nombre=Metamorfosis
app.registro.minutos-vigencia=30

# Sub-metas: zona horaria con la que se cuenta "hoy" al registrar el día
app.zona-horaria=${APP_ZONA_HORARIA:America/Bogota}

# RQ8: log de aplicación. Además de la consola, se escribe en un archivo con rotación
# (10 MB por archivo, 14 archivos de historia, 100 MB en total). En Render el disco es
# temporal: allí el log se consulta en la pestaña Logs del servicio.
# Nunca se registran contraseñas, tokens completos ni datos personales innecesarios (Ley 1581 de 2012).
logging.file.name=${LOG_FILE:logs/metamorfosis.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=100MB
logging.level.root=INFO
logging.level.com.metamorfosis=INFO
