spring.application.name=backend
spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Nunca exponer detalles internos en errores
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

app.cors.allowed-origins=http://localhost:5173

# HU21: URL pública del frontend, para armar los enlaces de logros compartidos (<url>/logros/<token>)
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
